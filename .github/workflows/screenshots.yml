name: Visual screenshots
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start isolated local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/nerva-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Capture desktop and mobile
        run: |
          mkdir -p screenshots
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "1440,900" --full-page --wait-for-timeout 1500 http://127.0.0.1:4173/ screenshots/nerva-home-1440x900.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "1920,1080" --full-page --wait-for-timeout 1500 http://127.0.0.1:4173/ screenshots/nerva-home-1920x1080.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "390,844" --full-page --wait-for-timeout 1500 http://127.0.0.1:4173/ screenshots/nerva-home-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: nerva-home-screenshots
          path: screenshots/
          if-no-files-found: error
